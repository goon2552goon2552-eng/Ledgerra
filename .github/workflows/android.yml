name: Build Ledgerra APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: |
          set -e
          Z=""
          for z in *.zip; do if unzip -l "$z" | grep -q capacitor.config.json; then Z="$z"; break; fi; done
          test -n "$Z" || { echo "upload the project zip first"; exit 1; }
          unzip -q -o "$Z" -d proj
          C=$(find proj -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "APP=$GITHUB_WORKSPACE/$(dirname "$C")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o "$RUNNER_TEMP/ct.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/ct.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.APP }}
        run: |
          npm install --no-audit --no-fund
          npm run android:prepare
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign
        working-directory: ${{ env.APP }}
        env:
          KS_B64: ${{ secrets.LEDGERRA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LEDGERRA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "missing secret LEDGERRA_KEYSTORE_B64"; exit 1; }
          test -n "$KS_PASS" || { echo "missing secret LEDGERRA_KEYSTORE_PASSWORD"; exit 1; }
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/k.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(node -p "require('./package.json').version")
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/a.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.jks" --ks-key-alias ledgerra --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$GITHUB_WORKSPACE/ledgerra-$VER.apk" "$RUNNER_TEMP/a.apk"
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/ledgerra-$VER.apk"
          rm -f "$RUNNER_TEMP/k.jks" "$RUNNER_TEMP/a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerra-apk
          path: ledgerra-*.apk
          retention-days: 7
