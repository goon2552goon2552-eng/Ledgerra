name: Build Ledgerra APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ledgerra-android.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: ledgerra-android
        run: |
          npm install --no-audit --no-fund
          npm run android:prepare
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign
        working-directory: ledgerra-android
        env:
          KS_B64: ${{ secrets.LEDGERRA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LEDGERRA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "missing secret LEDGERRA_KEYSTORE_B64"; exit 1; }
          test -n "$KS_PASS" || { echo "missing secret LEDGERRA_KEYSTORE_PASSWORD"; exit 1; }
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/k.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(node -p "require('./package.json').version")
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/a.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.jks" --ks-key-alias ledgerra --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "../ledgerra-$VER.apk" "$RUNNER_TEMP/a.apk"
          "$BT/apksigner" verify "../ledgerra-$VER.apk"
          rm -f "$RUNNER_TEMP/k.jks" "$RUNNER_TEMP/a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerra-apk
          path: ledgerra-*.apk
          retention-days: 7
